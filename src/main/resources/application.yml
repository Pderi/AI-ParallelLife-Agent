spring:
  application:
    name: q-AI-agent-Project-Backend
  profiles:
    active: local

# 三层记忆 MVP：默认 legacy（kryo），本地切 pg 见 application-local.yml.example
memory:
  provider: legacy
  warm-top-k: 3
  rag-top-k: 3
  cold-recent-rounds: 3
  extract-min-turns: 2
  embedding-dimensions: 1536
  seed-rag-on-startup: true

tool:
  terminal:
    enabled: false
    allowed-commands:
      - dir
      - echo
      - type
      - findstr

server:
  port: 8123
  servlet:
    context-path: /api
# springdoc-openapi
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.qin.qaiagentproject.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn
